name: Update AI Orukan Signal

on:
  schedule:
    # オルカンは投資信託のため基準価額は1日1回しか更新されない。
    # 海外資産を含むため確定・公表にタイムラグがあることも踏まえ、
    # 日本時間の朝(UTC 22:00 = JST翌7:00)と夜(UTC 12:00 = JST21:00)の
    # 1日2回、確認の意味も込めて実行する。
    - cron: "0 22 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute signal
        run: python scripts/compute_signal.py

      - name: Commit signal.json
        run: |
          git config user.name "allcon-signal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add signal.json
          git diff --cached --quiet && echo "変更なし。コミットをスキップします。" || git commit -m "chore: update signal.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
          git pull --rebase origin main || { echo "::warning::別の実行と競合したため、今回の更新はスキップします（次回の実行で自動的に解消されます）"; git rebase --abort; exit 0; }
          git push
